# Opens a pull request on the Bazel Central Registry for a release.
#
# Runs after release.yml when the BCR_PUBLISH_TOKEN secret exists; can also be
# run by hand for an existing tag
# (Actions > Publish to BCR > Run workflow).
#
# One-time setup by a maintainer:
#   1. Fork https://github.com/bazelbuild/bazel-central-registry to
#      martianoff/bazel-central-registry.
#   2. Create a classic personal access token with the "repo" and "workflow"
#      scopes and save it as the repository secret BCR_PUBLISH_TOKEN.
#
# The pull request opens as a draft; mark it "Ready for review" to approve it.
name: Publish to BCR

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      publish_token:
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: Released tag, e.g. v0.1.0
        required: true
        type: string

jobs:
  publish:
    # https://github.com/bazel-contrib/publish-to-bcr/blob/main/.github/workflows/publish.yaml
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@1ae09341a6014e9bea052879c42392ac6b8b632c # v1.7.0
    with:
      tag_name: ${{ inputs.tag_name }}
      registry_fork: martianoff/bazel-central-registry
      draft: true
      attest: true
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets:
      publish_token: ${{ secrets.publish_token || secrets.BCR_PUBLISH_TOKEN }}
